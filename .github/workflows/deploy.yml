name: Deploy to HF Space

# Manual-trigger only until the HF Space exists. To activate the
# auto-deploy on push to main, replace the `workflow_dispatch:` block
# below with the commented `push:` block and set HF_TOKEN as a repo
# secret (https://huggingface.co/settings/tokens — write scope).
#
# Per ARCHITECTURE.md §3:
#   HF Space:  <HF_USER>/galaxy-vit-demo
#   Hardware:  Docker, free CPU Basic
#   Port:      7860 (uvicorn + FastAPI; matches Dockerfile EXPOSE)

on:
  workflow_dispatch:
    inputs:
      hf_user:
        description: "HF username that owns the Space"
        required: true
        type: string
  # Activate once Space exists + HF_TOKEN secret is configured:
  # push:
  #   branches: [main]

jobs:
  push-to-hf-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=1,<2"

      - name: Ensure HF Space repo exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ inputs.hf_user }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret not configured; create one at https://huggingface.co/settings/tokens"
            exit 1
          fi
          python <<'PY'
          import os
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = f"{os.environ['HF_USER']}/galaxy-vit-demo"
          # Idempotent: creates the Space if missing, no-ops otherwise.
          # space_sdk='docker' matches our Dockerfile-based deploy.
          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,
              )
              print(f"::notice::Space {repo_id} exists (or was created).")
          except HfHubHTTPError as exc:
              print(
                  f"::error::Failed to create Space {repo_id}: {exc}. "
                  "Check that HF_TOKEN has write scope and the username "
                  "in workflow_dispatch.inputs.hf_user is correct."
              )
              raise
          PY

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ inputs.hf_user }}
        run: |
          python <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = f"{os.environ['HF_USER']}/galaxy-vit-demo"
          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              commit_message=f"deploy from gh actions {os.environ.get('GITHUB_SHA', 'unknown')[:7]}",
              ignore_patterns=[
                  ".git/**",
                  ".venv/**",
                  "**/__pycache__/**",
                  "**/.pytest_cache/**",
                  "**/.mypy_cache/**",
                  "**/.ruff_cache/**",
                  "frontend/node_modules/**",
                  "tests/**",
                  # Model checkpoints are gitignored anyway; the lifespan
                  # handler downloads M3 from HF Hub on demand. M1 is not
                  # currently published so /api/predict 503s on the Space
                  # (Classify tab gracefully degrades; everything else works).
                  "runs/**/best.pt",
                  "runs/**/tb/**",
                  # Trainer-time-only artifact (~3 MB); not used at runtime.
                  "artifacts/per_epoch_demo_features.parquet",
                  # T6.1 paper draft sources -- not part of the deployed demo.
                  "paper/**",
                  "tools/**",
                  "docs/_*_rendered.md",
                  # Local releases parquet; the live demo doesn't read it.
                  "releases/**",
              ],
          )
          PY

      - name: Wait for Space build + ping /api/health
        env:
          HF_USER: ${{ inputs.hf_user }}
        run: |
          # First-build of an ML Docker image (PyTorch CPU + transformers
          # + timm + matplotlib + ...) typically takes 8-15 minutes on
          # HF's build infra. We poll for up to 20 minutes before
          # giving up; subsequent rebuilds are 2-3x faster thanks to
          # Docker layer cache.
          SPACE_URL="https://${HF_USER}-galaxy-vit-demo.hf.space"
          DEADLINE=$(( $(date +%s) + 1200 ))  # 20 minutes
          echo "Polling $SPACE_URL/api/health until $DEADLINE (epoch s)..."
          attempt=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            attempt=$((attempt + 1))
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SPACE_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "::notice::Space is up at $SPACE_URL (after $attempt attempts)"
              exit 0
            fi
            # Verbose every 10 attempts; quieter polls otherwise so the
            # log doesn't get drowned in 503 noise during the long
            # Docker build phase.
            if [ $((attempt % 10)) -eq 1 ]; then
              echo "  attempt $attempt: $code (still building / not ready)"
            fi
            sleep 15
          done
          echo "::error::Space did not return 200 within the 20-minute window"
          echo "::error::Check build logs at https://huggingface.co/spaces/${HF_USER}/galaxy-vit-demo/logs/build"
          exit 1
