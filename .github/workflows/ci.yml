name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # [dev] + [m1] (datasets, pillow, pandas) + [m1-serve] (fastapi,
          # uvicorn, httpx, python-multipart) cover the FastAPI route
          # decorators (mypy needs the types) and the parquet-reading
          # tests (pandas needed). Torch CPU is installed separately so
          # mypy can resolve @torch.no_grad() and @torch.special.gammaln
          # decorators in the trainer modules, AND the lightweight
          # torch-based unit tests (calibration, head, loss, posterior,
          # masking) can actually run instead of skip.
          python -m pip install -e ".[dev,m1,m1-serve]"
          python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy galaxy_vit

      - name: Pytest (offline)
        env:
          # Tests must not touch the network; this is enforced by
          # convention (fixtures in tests/fixtures/), reinforced by
          # unsetting HF / transformers cache vars.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Tests construct Settings via env vars rather than .env so
          # they're hermetic.
          HF_USER: "ci"
          HF_TOKEN: "ci-placeholder"
          DATA_DIR: "/tmp/galaxy-vit-data"
        run: pytest -q
